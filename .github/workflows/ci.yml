name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get

      # Every step runs the same melos script a human runs locally, so a broken
      # script fails the build instead of quietly rotting.
      - name: Formatting
        run: dart run melos run format-check

      - name: Analyze (zero diagnostics of any severity)
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test

      - name: Run the example
        run: dart run melos run example

      - name: What pub.dev would see
        run: dart run melos run pub-check
